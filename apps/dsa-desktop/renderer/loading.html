<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Stock Analysis</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08080c;
        --bg-secondary: #131722;
        --panel: rgba(16, 18, 28, 0.92);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --dim: rgba(148, 163, 184, 0.55);
        --accent: #38bdf8;
        --ok: #20ac6b;
        --warn: #f59e0b;
        --danger: #f43f25;
        --border: rgba(56, 189, 248, 0.22);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Fira Sans", "IBM Plex Sans", "Segoe UI", "Microsoft YaHei", sans-serif;
        background: radial-gradient(circle at 20% 0%, var(--bg-secondary), var(--bg) 55%);
        color: var(--text);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .panel {
        width: min(680px, 92vw);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 30px 34px 26px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(20px);
      }

      .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 4px;
      }

      .title {
        font-size: 22px;
        margin: 0;
        letter-spacing: 0.4px;
        font-weight: 650;
      }

      .badge {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 10px;
        white-space: nowrap;
      }

      .subtitle {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 13px;
      }

      /* ---------- 检查项 ---------- */
      .checks {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 22px;
      }

      .check {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 9px;
        font-size: 13.5px;
        transition: background 0.25s ease;
      }

      .check + .check { margin-top: 1px; }

      .check.pending { opacity: 0.45; }
      .check.active { background: rgba(56, 189, 248, 0.07); }
      .check.pass .name { color: var(--text); }
      .check.fail { background: rgba(244, 63, 37, 0.07); }
      .check.warn { background: rgba(245, 158, 11, 0.06); }

      .icon {
        width: 18px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        line-height: 1;
      }

      .spinner {
        width: 13px;
        height: 13px;
        border: 2px solid rgba(56, 189, 248, 0.22);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .name {
        color: var(--muted);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .name .req {
        font-size: 10px;
        color: var(--dim);
        margin-left: 6px;
        letter-spacing: 0.5px;
      }

      .detail {
        font-size: 12px;
        color: var(--dim);
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 280px;
      }

      .check.pass .detail { color: rgba(32, 172, 107, 0.82); }
      .check.fail .detail { color: var(--danger); }
      .check.warn .detail { color: var(--warn); }

      /* ---------- 进度条 ---------- */
      .bar-wrap {
        height: 6px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.14);
        overflow: hidden;
        margin-bottom: 10px;
      }

      .bar {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--ok));
        transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 0 14px rgba(56, 189, 248, 0.55);
      }

      .bar.fail {
        background: linear-gradient(90deg, var(--danger), #b91c3c);
        box-shadow: 0 0 14px rgba(244, 63, 37, 0.5);
      }

      .bar-meta {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--dim);
        margin-bottom: 16px;
      }

      .bar-meta .pct { font-variant-numeric: tabular-nums; color: var(--muted); }

      /* ---------- 结果区 ---------- */
      .verdict {
        display: none;
        border-radius: 11px;
        padding: 13px 15px;
        font-size: 13px;
        line-height: 1.65;
      }

      .verdict.show { display: block; }

      .verdict.ok {
        background: rgba(32, 172, 107, 0.09);
        border: 1px solid rgba(32, 172, 107, 0.34);
        color: #7ee2b0;
      }

      .verdict.bad {
        background: rgba(244, 63, 37, 0.08);
        border: 1px solid rgba(244, 63, 37, 0.34);
        color: #fca5a5;
      }

      .verdict strong { font-weight: 650; display: block; margin-bottom: 5px; }

      .verdict ul { margin: 6px 0 0; padding-left: 18px; }
      .verdict li { margin: 2px 0; }

      /* 自检通过后的展示位：预留给后续要加的文字/标语/版本信息 */
      .showcase {
        display: none;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px dashed rgba(148, 163, 184, 0.18);
        font-size: 12.5px;
        line-height: 1.75;
        color: var(--dim);
        animation: fadeUp 0.5s ease both;
      }

      .showcase.show { display: block; }

      .showcase .showcase-title {
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 4px;
      }

      /* 自检通过后：进度条淡出，改为中英文艺术字格言 */
      .bar-wrap,
      .bar-meta {
        transition: opacity 0.7s ease;
      }

      .bar-wrap.is-fading,
      .bar-meta.is-fading {
        opacity: 0;
      }

      .showcase-quote {
        text-align: center;
        padding: 6px 14px 4px;
        white-space: nowrap;
      }

      .quote-zh {
        margin: 0;
        font-family: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "STSong", "SimSun", Georgia, serif;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.9;
        letter-spacing: 0.18em;
        white-space: nowrap;
        background: linear-gradient(96deg, var(--accent) 0%, #a78bfa 52%, var(--ok) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: quoteIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .quote-en {
        margin: 9px 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-size: 11.5px;
        line-height: 1.7;
        letter-spacing: 0.08em;
        white-space: nowrap;
        color: var(--muted);
        animation: quoteIn 1.15s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
      }

      @keyframes quoteIn {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.985);
          filter: blur(2px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }

      .actions {
        display: none;
        gap: 10px;
        margin-top: 14px;
      }

      .actions.show { display: flex; }

      button {
        font: inherit;
        font-size: 12.5px;
        border-radius: 8px;
        padding: 8px 16px;
        cursor: pointer;
        border: 1px solid var(--border);
        background: rgba(56, 189, 248, 0.1);
        color: var(--accent);
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      button:hover {
        background: rgba(56, 189, 248, 0.18);
        border-color: rgba(56, 189, 248, 0.45);
      }

      button.ghost {
        background: transparent;
        color: var(--muted);
        border-color: rgba(148, 163, 184, 0.22);
      }

      button.ghost:hover {
        background: rgba(148, 163, 184, 0.08);
        color: var(--text);
      }

      .tips {
        margin-top: 16px;
        font-size: 11.5px;
        color: var(--dim);
        line-height: 1.6;
      }

      .tips code {
        color: var(--muted);
        background: rgba(148, 163, 184, 0.1);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="head">
        <h1 class="title">Daily Stock Analysis</h1>
        <span class="badge" id="badge">启动自检</span>
      </div>
      <p class="subtitle">正在检查本地服务连通性，全部通过后自动进入主界面</p>

      <div class="checks" id="checks"></div>

      <div class="bar-wrap" id="barWrap">
        <div class="bar" id="bar"></div>
      </div>
      <div class="bar-meta" id="barMeta">
        <span id="stage">准备中…</span>
        <span class="pct" id="pct">0%</span>
      </div>

      <div class="verdict" id="verdict"></div>

      <!-- 展示位：自检通过后显示。后续要加的文字/标语/版本信息放这里。 -->
      <div class="showcase" id="showcase"></div>

      <div class="actions" id="actions">
        <button id="retryBtn">重新检测</button>
        <button class="ghost" id="forceBtn">仍然进入</button>
      </div>

      <p class="tips">
        若长时间无响应，可检查应用安装目录下的 <code>logs</code> 文件夹，
        或在启动器的日志输出中查看服务启动记录。
      </p>
    </div>

    <script>
      (function () {
        "use strict";

        // ----------------------------- 配置 -----------------------------
        const BACKEND = "http://127.0.0.1:8000";
        const BRIDGE = "http://127.0.0.1:18999";
        const SECTOR = "http://127.0.0.1:8799";

        // 启动期的服务是逐步就绪的，给足重试窗口。
        // 总等待预算 ≈ 单次超时 × 重试次数，按最慢的启动器实测（约 60s）留够余量。
        const PROBE_TIMEOUT_MS = 2500;   // 单次请求超时
        const MAX_ATTEMPTS = 20;         // 每项最多探多少次
        const RETRY_DELAY_MS = 1500;     // 两次探测间隔
        // 服务全在跑时自检会瞬间完成，用户看不到过程。
        // 给每项一个最小可见时长 + 通过后停留 2 秒，保证动画能被看见、也留出展示位的空间。
        const MIN_ITEM_MS = 300;         // 每项状态至少亮这么久
        const HOLD_AFTER_PASS_MS = 3600; // 自检通过后停留多久再跳转（留足时间看清格言）

        // 必需项缺一不可；可选项只降级提示，不阻塞进入。
        const CHECKS = [
          {
            id: "backend",
            name: "后端服务",
            endpoint: "127.0.0.1:8000",
            required: true,
            probe: async () => {
              const data = await getJson(BACKEND + "/api/health", PROBE_TIMEOUT_MS);
              if (!data || data.status !== "ok") throw new Error("健康检查未返回 ok");
              return "已就绪";
            },
          },
          {
            id: "database",
            name: "数据库",
            endpoint: "portfolio_accounts",
            required: true,
            probe: async () => {
              const data = await getJson(BACKEND + "/api/v1/portfolio/accounts", PROBE_TIMEOUT_MS);
              const list = Array.isArray(data) ? data : (data && data.accounts) || [];
              if (!Array.isArray(list)) throw new Error("账户接口返回格式异常");
              return list.length > 0 ? list.length + " 个账户已加载" : "已连接（无账户）";
            },
          },
          {
            id: "frontend",
            name: "主界面资源",
            endpoint: "GET /",
            required: true,
            probe: async () => {
              const res = await fetchWithTimeout(BACKEND + "/", PROBE_TIMEOUT_MS);
              if (!res.ok) throw new Error("HTTP " + res.status);
              const html = await res.text();
              if (!html || html.length < 100) throw new Error("页面内容为空");
              return "已就绪";
            },
          },
          {
            id: "sector",
            name: "行业中间层",
            endpoint: "127.0.0.1:8799",
            required: false,
            probe: async () => {
              const data = await getJson(SECTOR + "/healthz", PROBE_TIMEOUT_MS);
              if (!data || data.ok !== true) throw new Error("healthz 未返回 ok");
              const n = data.merged_positions;
              return n ? "已就绪（" + n + " 个持仓）" : "已就绪";
            },
          },
          {
            id: "bridge",
            name: "搜索桥接",
            endpoint: "127.0.0.1:18999",
            required: false,
            probe: async () => {
              const data = await getJson(BRIDGE + "/health", PROBE_TIMEOUT_MS);
              if (!data) throw new Error("无响应");
              return "已就绪";
            },
          },
        ];

        // ----------------------------- 工具 -----------------------------
        function fetchWithTimeout(url, ms) {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), ms);
          return fetch(url, { signal: ctrl.signal, cache: "no-store" }).finally(() =>
            clearTimeout(timer)
          );
        }

        async function getJson(url, ms) {
          const res = await fetchWithTimeout(url, ms);
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        }

        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

        // ----------------------------- 状态 -----------------------------
        const state = {
          running: false,
          aborted: false,
          results: new Map(), // id -> {status, detail}
        };

        const el = {
          checks: document.getElementById("checks"),
          barWrap: document.getElementById("barWrap"),
          barMeta: document.getElementById("barMeta"),
          bar: document.getElementById("bar"),
          pct: document.getElementById("pct"),
          stage: document.getElementById("stage"),
          verdict: document.getElementById("verdict"),
          showcase: document.getElementById("showcase"),
          actions: document.getElementById("actions"),
          badge: document.getElementById("badge"),
          retryBtn: document.getElementById("retryBtn"),
          forceBtn: document.getElementById("forceBtn"),
        };

        // ----------------------------- 渲染 -----------------------------
        function buildRows() {
          el.checks.innerHTML = "";
          CHECKS.forEach((c) => {
            const row = document.createElement("div");
            row.className = "check pending";
            row.id = "row-" + c.id;
            row.innerHTML =
              '<span class="icon" id="icon-' + c.id + '">·</span>' +
              '<span class="name">' + c.name +
              '<span class="req">' + (c.required ? "必需" : "可选") + "</span></span>" +
              '<span class="detail" id="detail-' + c.id + '">等待中…</span>';
            el.checks.appendChild(row);
          });
        }

        function setRow(id, status, detail) {
          const row = document.getElementById("row-" + id);
          const icon = document.getElementById("icon-" + id);
          const det = document.getElementById("detail-" + id);
          if (!row) return;

          row.className = "check " + status;
          if (status === "active") {
            icon.innerHTML = '<span class="spinner"></span>';
          } else if (status === "pass") {
            icon.textContent = "✓";
            icon.style.color = "var(--ok)";
          } else if (status === "fail") {
            icon.textContent = "✕";
            icon.style.color = "var(--danger)";
          } else if (status === "warn") {
            icon.textContent = "!";
            icon.style.color = "var(--warn)";
          } else {
            icon.textContent = "·";
            icon.style.color = "var(--dim)";
          }
          if (detail !== undefined) det.textContent = detail;
        }

        function setProgress(done, total) {
          const pct = total === 0 ? 0 : Math.round((done / total) * 100);
          el.bar.style.width = pct + "%";
          el.pct.textContent = pct + "%";
          return pct;
        }

        function setVerdict(kind, html) {
          el.verdict.className = "verdict show " + kind;
          el.verdict.innerHTML = html;
        }

        // ----------------------------- 探测 -----------------------------
        async function probeOne(check) {
          let lastErr = null;
          for (let i = 0; i < MAX_ATTEMPTS; i++) {
            if (state.aborted) throw new Error("aborted");
            try {
              const detail = await check.probe();
              return { ok: true, detail: detail };
            } catch (e) {
              lastErr = e;
              // 前几轮失败是正常的（服务还在启动），保持 active 状态继续等
              if (i < MAX_ATTEMPTS - 1) await sleep(RETRY_DELAY_MS);
            }
          }
          return { ok: false, detail: String((lastErr && lastErr.message) || lastErr || "未知错误") };
        }

        async function runAll(userTriggered) {
          if (state.running) return;
          state.running = true;
          state.aborted = false;
          state.results.clear();

          el.retryBtn.disabled = true;
          el.forceBtn.disabled = true;
          el.verdict.className = "verdict";
          el.actions.className = "actions";
          el.bar.className = "bar";
          el.badge.textContent = "启动自检";
          setProgress(0, CHECKS.length);
          buildRows();

          const startedAt = Date.now();
          let done = 0;

          for (const check of CHECKS) {
            if (state.aborted) break;

            setRow(check.id, "active", "检测中…");
            el.stage.textContent = "正在检查 " + check.name + "…";

            const itemStartedAt = Date.now();
            const result = await probeOne(check);
            state.results.set(check.id, result);
            done += 1;

            if (result.ok) {
              setRow(check.id, "pass", result.detail);
            } else if (check.required) {
              setRow(check.id, "fail", result.detail);
            } else {
              setRow(check.id, "warn", result.detail + "（不影响进入）");
            }

            setProgress(done, CHECKS.length);

            // 保证每一项的结果至少可见 MIN_ITEM_MS，否则动画一闪而过
            const spent = Date.now() - itemStartedAt;
            if (spent < MIN_ITEM_MS) await sleep(MIN_ITEM_MS - spent);
          }

          if (state.aborted) {
            state.running = false;
            return;
          }

          // ----------------------------- 判定 -----------------------------
          const elapsed = ((Date.now() - startedAt) / 1000).toFixed(1);
          const requiredFails = CHECKS.filter(
            (c) => c.required && !(state.results.get(c.id) || {}).ok
          );
          const optionalFails = CHECKS.filter(
            (c) => !c.required && !(state.results.get(c.id) || {}).ok
          );

          if (requiredFails.length === 0) {
            el.badge.textContent = "就绪";
            el.bar.className = "bar";
            setProgress(CHECKS.length, CHECKS.length);
            el.stage.textContent = "自检通过（" + elapsed + " 秒）";

            const warnNote = optionalFails.length
              ? '<div style="margin-top:6px;color:#fcd34d">另有 ' + optionalFails.length +
                " 项可选服务未就绪（" + optionalFails.map((c) => c.name).join("、") +
                "），相关功能会降级，不影响主界面使用。</div>"
              : "";
            setVerdict(
              "ok",
              "<strong>✓ 满足进入主界面的最低条件</strong>" +
                "必需服务全部就绪，正在进入主界面…" +
                warnNote
            );

            // 告诉 Electron 主进程：自检已画完，可以切换主界面了
            window.__dsaSelfCheckDone = true;

            // 进度条渐渐隐去，把位置让给格言
            el.barWrap.classList.add("is-fading");
            el.barMeta.classList.add("is-fading");

            // 展示位：自检通过后显示中英文投资格言
            if (!el.showcase.dataset.customized) {
              el.showcase.innerHTML =
                '<div class="showcase-quote">' +
                '<p class="quote-zh">华尔街有老交易员，也有大胆交易员，但没有又老又大胆的交易员。</p>' +
                '<p class="quote-en">There are old traders and bold traders, but no old bold traders.</p>' +
                "</div>";
              el.showcase.dataset.customized = "1";
            }
            el.showcase.className = "showcase show";

            // 进度条走满后停留 3.6 秒，让格言完整呈现再进入主界面
            setTimeout(() => {
              document.dispatchEvent(new CustomEvent("dsa-enter-main"));
              el.stage.textContent = "即将进入主界面…";
            }, HOLD_AFTER_PASS_MS);
          } else {
            el.badge.textContent = "未通过";
            el.bar.className = "bar fail";
            el.stage.textContent = "自检未通过（" + elapsed + " 秒）";

            const items = requiredFails
              .map((c) => {
                const r = state.results.get(c.id) || {};
                return "<li><b>" + c.name + "</b>（" + c.endpoint + "）：" +
                  escapeHtml(String(r.detail || "未知错误")) + "</li>";
              })
              .join("");
            const optNote = optionalFails.length
              ? '<div style="margin-top:8px;color:#fcd34d">另有 ' + optionalFails.length +
                " 项可选服务未就绪，不是本次失败原因。</div>"
              : "";
            setVerdict(
              "bad",
              "<strong>✕ 未满足进入主界面的最低条件</strong>" +
                "以下必需服务未响应：" +
                "<ul>" + items + "</ul>" + optNote
            );
            el.actions.className = "actions show";
            window.__dsaSelfCheckDone = true;
          }

          el.retryBtn.disabled = false;
          el.forceBtn.disabled = false;
          state.running = false;
          if (userTriggered) console.log("[dsa-selfcheck] 重试完成", state.results);
        }

        function escapeHtml(s) {
          return s.replace(/[&<>"']/g, (ch) => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
          }[ch]));
        }

        // ----------------------------- 交互 -----------------------------
        el.retryBtn.addEventListener("click", () => runAll(true));

        // 兜底：必需项不通但用户坚持进入（主界面自己会显示错误详情）
        el.forceBtn.addEventListener("click", () => {
          el.stage.textContent = "已跳过自检，尝试进入…";
          document.dispatchEvent(new CustomEvent("dsa-enter-main"));
          window.location.href = BACKEND + "/";
        });

        // 启动失败时 main.js 会带 ?error= 参数打开本页
        (function showStartupError() {
          const params = new URLSearchParams(window.location.search);
          const err = params.get("error");
          if (!err) return;
          el.badge.textContent = "启动失败";
          el.bar.className = "bar fail";
          setVerdict(
            "bad",
            "<strong>✕ 启动失败</strong>" + escapeHtml(decodeURIComponent(err))
          );
          el.actions.className = "actions show";
        })();

        // ----------------------------- 启动 -----------------------------
        buildRows();
        runAll(false);
      })();
    </script>
  </body>
</html>
